<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soko Mpya | Fast, Secure Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.5.1/css/all.css">
    <style>
        :root {
            --brand: #2563eb; /* Vibrant Cyber Blue */
            --bg: #ffffff;
            --surface: #f8fafc;
            --text: #0f172a;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            line-height: 1.5;
        }

        /* Speed Optimizations */
        .fast-load { content-visibility: auto; }
        img { border-radius: 12px; object-fit: contain; background: #f1f5f9; }

        /* Logo Design */
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-box {
            width: 36px;
            height: 36px;
            background: var(--brand);
            color: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 20px;
        }
        .logo-text { line-height: 1; }
        .logo-top { display: block; font-weight: 800; font-size: 18px; color: var(--text); letter-spacing: -0.5px; }
        .logo-bottom { display: block; font-weight: 700; font-size: 9px; color: var(--brand); letter-spacing: 2px; text-transform: uppercase; }

        /* Layout */
        .nav-sticky { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.8); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
        .content-width { max-width: 1200px; margin: 0 auto; padding: 0 16px; }

        /* Modern Category Scroller */
        .cat-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0; scrollbar-width: none; }
        .cat-scroll::-webkit-scrollbar { display: none; }
        .cat-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 99px;
            white-space: nowrap;
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            transition: 0.2s;
        }
        .cat-btn.active { background: var(--brand); border-color: var(--brand); color: white; }

        /* Performance Grid */
        .ad-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media (min-width: 768px) { .ad-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; } }

        .ad-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 8px;
            transition: 0.2s;
            cursor: pointer;
        }
        .ad-card:hover { border-color: var(--brand); transform: translateY(-2px); }
        .ad-img { aspect-ratio: 1; width: 100%; border-radius: 10px; margin-bottom: 8px; }
        .ad-price { font-weight: 800; font-size: 15px; color: var(--brand); }
        .ad-name { font-size: 13px; font-weight: 600; color: var(--text); display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }

        /* Search */
        .search-wrap { position: relative; margin: 12px 0; }
        .search-input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 12px 40px;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
        }
        .search-input:focus { border-color: var(--brand); background: white; }
    </style>
</head>
<body>

    <nav class="nav-sticky">
        <div class="content-width h-16 flex items-center justify-between">
            <a href="#" class="logo">
                <div class="logo-box">S</div>
                <div class="logo-text">
                    <span class="logo-top">SOKO</span>
                    <span class="logo-bottom">MPYA</span>
                </div>
            </a>
            <button onclick="postAd()" class="bg-[#2563eb] text-white px-4 py-2 rounded-lg text-xs font-bold uppercase tracking-wide">Post Ad</button>
        </div>
    </nav>

    <main class="content-width">
        <div class="search-wrap">
            <i class="fa fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" class="search-input" placeholder="What are you looking for?" onkeyup="search(this.value)">
        </div>

        <div class="cat-scroll" id="cats"></div>

        <div class="flex items-center justify-between py-4">
            <h2 class="text-sm font-bold uppercase tracking-wider text-slate-500" id="title">New Listings</h2>
            <span class="text-[10px] font-bold text-slate-400" id="stats"></span>
        </div>

        <div class="ad-grid fast-load" id="grid"></div>
        <div class="h-20"></div>
    </main>

    <!-- Modal (Native & Fast) -->
    <div id="modal" class="fixed inset-0 z-[100] hidden flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/50 backdrop-blur-sm">
        <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl overflow-hidden shadow-2xl relative animate-in slide-in-from-bottom duration-300">
            <button onclick="closeM()" class="absolute top-4 right-4 w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-slate-600"><i class="fa fa-times"></i></button>
            <div class="p-4 sm:p-6">
                <img id="m-img" class="w-full aspect-square object-contain bg-slate-50 rounded-2xl mb-4">
                <span id="m-badge" class="text-[10px] font-black uppercase text-blue-600 mb-2 block"></span>
                <h3 id="m-name" class="text-xl font-bold mb-1"></h3>
                <p id="m-price" class="text-2xl font-black text-blue-600 mb-4"></p>
                <div class="bg-slate-50 p-4 rounded-xl text-xs text-slate-500 mb-6 leading-relaxed" id="m-specs"></div>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="call()" class="bg-blue-600 text-white py-4 rounded-xl font-bold uppercase text-xs">Call</button>
                    <button onclick="wpp()" class="bg-[#25D366] text-white py-4 rounded-xl font-bold uppercase text-xs">WhatsApp</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CATEGORIES = [
            { id: 'all', name: 'All', icon: 'fa-grid' },
            { id: 'laptops', name: 'Laptops' },
            { id: 'phones', name: 'Phones' },
            { id: 'motors', name: 'Motors' },
            { id: 'fashion', name: 'Fashion' },
            { id: 'land', name: 'Land' }
        ];

        const ADS = [
            { id: 1, cat: 'laptops', name: 'HP EliteBook 840 G8', price: 'KSh 85,000', img: 'https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=400&q=50', specs: 'Intel Core i7 11th Gen • 16GB RAM • 512GB SSD • Ex-UK Grade A', badge: 'Verified' },
            { id: 2, cat: 'phones', name: 'iPhone 15 Pro Max', price: 'KSh 185,000', img: 'https://images.unsplash.com/photo-1695048133142-1a20484d2569?auto=format&fit=crop&w=400&q=50', specs: '256GB • Natural Titanium • Mint Condition • Battery 100%', badge: 'Premium' },
            { id: 3, cat: 'motors', name: 'Toyota Harrier 2018', price: 'KSh 3,850,000', img: 'https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?auto=format&fit=crop&w=400&q=50', specs: 'Zero Mileage • Panoramic Sunroof • Leather Interior', badge: 'New' },
            { id: 4, cat: 'fashion', name: 'Luxury Chronograph', price: 'KSh 12,500', img: 'https://images.unsplash.com/photo-1524592094714-0f0654e20314?auto=format&fit=crop&w=400&q=50', specs: 'Automatic • Sapphire Glass • Water Resistant', badge: 'Luxury' },
            { id: 5, cat: 'land', name: '50x100 Kamulu', price: 'KSh 950,000', img: 'https://images.unsplash.com/photo-1500382017468-9049fee74a62?auto=format&fit=crop&w=400&q=50', specs: 'Prime location near tarmac • Ready Title Deed', badge: 'Urgent' },
            { id: 6, cat: 'laptops', name: 'MacBook Pro M2 14"', price: 'KSh 245,000', img: 'https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=400&q=50', specs: 'M2 Chip • 16GB RAM • 512GB SSD • Brand New', badge: 'New' }
        ];

        let cur = 'all';

        function init() {
            renderCats();
            filter('all');
        }

        function renderCats() {
            document.getElementById('cats').innerHTML = CATEGORIES.map(c => `
                <button class="cat-btn ${cur === c.id ? 'active' : ''}" onclick="filter('${c.id}')">${c.name}</button>
            `).join('');
        }

        function filter(id) {
            cur = id;
            const res = id === 'all' ? ADS : ADS.filter(a => a.cat === id);
            render(res);
            renderCats();
            document.getElementById('title').innerText = id === 'all' ? 'Featured Market' : id;
            document.getElementById('stats').innerText = `${res.length} items`;
        }

        function render(ads) {
            document.getElementById('grid').innerHTML = ads.map(a => `
                <div class="ad-card" onclick="openP(${a.id})">
                    <img src="${a.img}" class="ad-img" loading="lazy">
                    <div class="px-1">
                        <p class="ad-price">${a.price}</p>
                        <p class="ad-name">${a.name}</p>
                        <p class="text-[9px] text-slate-400 mt-1 uppercase font-bold tracking-wider">Nairobi</p>
                    </div>
                </div>
            `).join('');
        }

        function search(q) {
            const res = ADS.filter(a => a.name.toLowerCase().includes(q.toLowerCase()));
            render(res);
        }

        function openP(id) {
            const a = ADS.find(ad => ad.id === id);
            document.getElementById('m-img').src = a.img;
            document.getElementById('m-name').innerText = a.name;
            document.getElementById('m-price').innerText = a.price;
            document.getElementById('m-specs').innerText = a.specs;
            document.getElementById('m-badge').innerText = a.badge;
            document.getElementById('modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeM() {
            document.getElementById('modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function postAd() { alert("Post your items for free on Soko Mpya."); }
        function call() { alert("Dialing Merchant..."); }
        function wpp() { alert("Opening WhatsApp..."); }

        init();
    </script>
</body>
</html>
