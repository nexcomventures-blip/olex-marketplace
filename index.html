<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soko Mpya | The Future of Trading</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.5.1/css/all.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #08090a;
            --surface: #121417;
            --accent: #00ff88; /* Electric Green */
            --accent-dim: rgba(0, 255, 136, 0.1);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            overflow-x: hidden;
            letter-spacing: -0.01em;
        }

        /* --- Custom Scrollbar --- */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        /* --- Logo & Header --- */
        .glass-nav {
            background: rgba(8, 9, 10, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .logo-symbol {
            width: 32px;
            height: 32px;
            background: var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: black;
            box-shadow: 0 0 20px var(--accent-dim);
        }

        /* --- Search Hero --- */
        .search-container {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 8px 12px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .search-container:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-dim);
            transform: translateY(-2px);
        }

        /* --- Category Pills --- */
        .cat-pill {
            padding: 10px 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 99px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-dim);
        }

        .cat-pill:hover, .cat-pill.active {
            background: var(--accent);
            color: black;
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .cat-pill i { font-size: 14px; }

        /* --- Modern Listing Grid --- */
        .product-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 28px;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .product-card:hover {
            transform: translateY(-12px) scale(1.02);
            border-color: rgba(255,255,255,0.2);
            box-shadow: 0 30px 60px rgba(0,0,0,0.5);
        }

        .img-wrapper {
            position: relative;
            overflow: hidden;
            background: #1a1d21;
        }

        .product-card img {
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .product-card:hover img {
            transform: scale(1.1);
        }

        .badge-premium {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        /* --- Footer Nav (Mobile) --- */
        .mobile-nav {
            background: rgba(18, 20, 23, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
        }

        /* --- Modals --- */
        .modal-blur {
            backdrop-filter: blur(12px);
        }

        .btn-primary {
            background: var(--accent);
            color: black;
            font-weight: 800;
            border-radius: 20px;
            transition: all 0.3s;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px var(--accent-dim);
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-24 lg:pb-0">

    <!-- Header / Navbar -->
    <nav class="fixed top-0 w-full z-50 glass-nav">
        <div class="max-w-[1400px] mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="logo-symbol">S</div>
                <span class="text-xl font-bold tracking-tight">SOKO<span class="text-[var(--accent)] ml-1">MPYA</span></span>
            </div>

            <div class="hidden lg:flex items-center gap-10">
                <a href="#" class="text-sm font-semibold text-white">Home</a>
                <a href="#" class="text-sm font-semibold text-slate-400 hover:text-white transition">Explore</a>
                <a href="#" class="text-sm font-semibold text-slate-400 hover:text-white transition">Support</a>
            </div>

            <div class="flex items-center gap-6">
                <button class="text-slate-400 hover:text-white transition"><i class="fa fa-magnifying-glass text-lg"></i></button>
                <button onclick="openPostItem()" class="hidden sm:flex btn-primary px-6 py-2.5 text-xs items-center gap-2">
                    <i class="fa fa-plus text-[10px]"></i> LIST ITEM
                </button>
                <div class="w-10 h-10 rounded-full bg-white/10 border border-white/5 flex items-center justify-center cursor-pointer overflow-hidden">
                    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="User Avatar">
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-[1400px] mx-auto px-6 pt-32">
        
        <!-- Hero Search Section -->
        <div class="max-w-3xl mx-auto mb-16 text-center">
            <h1 class="text-4xl lg:text-6xl font-extrabold mb-8 leading-tight tracking-tighter">
                Discover the best items<br>in <span class="text-[var(--accent)] italic">The New Market.</span>
            </h1>
            <div class="search-container flex items-center gap-4">
                <i class="fa fa-search text-slate-500 ml-2"></i>
                <input type="text" class="bg-transparent border-none outline-none flex-1 text-base py-3" placeholder="Search for laptops, land, fashion..." onkeyup="handleSearch(this.value)">
                <button class="btn-primary px-8 py-3 rounded-[18px] text-sm">SEARCH</button>
            </div>
        </div>

        <!-- Categories Scroller -->
        <div class="flex gap-3 overflow-x-auto no-scrollbar pb-10 mb-6" id="catList">
            <!-- Rendered via JS -->
        </div>

        <!-- Listing Stats & Filter -->
        <div class="flex items-center justify-between mb-8">
            <div>
                <h2 class="text-2xl font-bold tracking-tight" id="catHeading">New Arrivals</h2>
                <p class="text-xs text-slate-500 mt-1" id="adStats">Browse the latest verified listings</p>
            </div>
            <div class="flex gap-2">
                <button class="p-3 bg-white/5 border border-white/5 rounded-xl text-slate-400 hover:text-white transition"><i class="fa fa-sliders"></i></button>
            </div>
        </div>

        <!-- Product Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8" id="productFeed">
            <!-- Products injected here -->
        </div>

        <!-- Load More -->
        <div class="py-20 text-center">
            <button class="px-10 py-4 bg-white/5 border border-white/5 rounded-2xl text-sm font-bold hover:bg-white/10 transition">LOAD MORE LISTINGS</button>
        </div>

    </main>

    <!-- Mobile Navigation Bar -->
    <div class="lg:hidden fixed bottom-0 w-full z-50 mobile-nav px-6 py-4 flex items-center justify-between">
        <button class="text-[var(--accent)] flex flex-col items-center gap-1">
            <i class="fa fa-house text-xl"></i>
            <span class="text-[9px] font-bold uppercase">Home</span>
        </button>
        <button class="text-slate-500 flex flex-col items-center gap-1">
            <i class="fa fa-compass text-xl"></i>
            <span class="text-[9px] font-bold uppercase">Explore</span>
        </button>
        <button onclick="openPostItem()" class="w-14 h-14 bg-[var(--accent)] text-black rounded-2xl flex items-center justify-center -mt-10 shadow-2xl shadow-[var(--accent-dim)] border-4 border-[var(--bg)]">
            <i class="fa fa-plus text-xl"></i>
        </button>
        <button class="text-slate-500 flex flex-col items-center gap-1">
            <i class="fa fa-comment text-xl"></i>
            <span class="text-[9px] font-bold uppercase">Chats</span>
        </button>
        <button class="text-slate-500 flex flex-col items-center gap-1">
            <i class="fa fa-user text-xl"></i>
            <span class="text-[9px] font-bold uppercase">Account</span>
        </button>
    </div>

    <!-- Product View Modal -->
    <div id="viewModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 lg:p-10">
        <div class="absolute inset-0 modal-blur bg-black/60" onclick="closeModal()"></div>
        <div class="relative bg-white text-black w-full max-w-5xl rounded-[40px] overflow-hidden flex flex-col lg:flex-row max-h-[95vh] animate-in slide-in-from-bottom duration-500">
            
            <div class="lg:w-[55%] bg-[#f8f9fa] flex items-center justify-center p-12 relative">
                <button onclick="closeModal()" class="absolute top-8 left-8 w-12 h-12 rounded-full bg-black/5 flex items-center justify-center text-xl hover:bg-black/10"><i class="fa fa-arrow-left"></i></button>
                <img id="m-img" src="" class="max-w-full max-h-[500px] object-contain drop-shadow-2xl">
            </div>
            
            <div class="lg:w-[45%] p-10 lg:p-16 overflow-y-auto flex flex-col">
                <div class="flex items-center gap-3 mb-6">
                    <span id="m-badge" class="px-4 py-1 bg-black text-white text-[10px] font-black uppercase rounded-full"></span>
                    <span id="m-cat" class="text-xs font-bold text-slate-400 uppercase tracking-widest"></span>
                </div>
                <h2 id="m-name" class="text-4xl font-black tracking-tighter mb-4 leading-tight"></h2>
                <p id="m-price" class="text-3xl font-black text-[#00c853] mb-8"></p>
                
                <div class="p-6 bg-slate-50 rounded-[32px] border border-slate-100 mb-10">
                    <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3">Description & Specs</h4>
                    <p id="m-specs" class="text-sm text-slate-600 leading-relaxed"></p>
                </div>

                <div class="mt-auto space-y-4">
                    <button onclick="contact('Call')" class="w-full py-5 bg-black text-white font-black rounded-3xl uppercase text-xs tracking-widest hover:scale-[1.02] transition">Call Merchant</button>
                    <button onclick="contact('WhatsApp')" class="w-full py-5 bg-[#25D366] text-white font-black rounded-3xl uppercase text-xs tracking-widest hover:scale-[1.02] transition">Chat on WhatsApp</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CATEGORIES = [
            { id: 'all', name: 'Trending', icon: 'fa-bolt-lightning' },
            { id: 'laptops', name: 'Laptops', icon: 'fa-laptop' },
            { id: 'phones', name: 'Phones', icon: 'fa-mobile-screen' },
            { id: 'motors', name: 'Motors', icon: 'fa-car' },
            { id: 'fashion', name: 'Fashion', icon: 'fa-shirt' },
            { id: 'land', name: 'Land', icon: 'fa-mountain-city' },
            { id: 'accessories', name: 'Accessories', icon: 'fa-plug-circle-plus' }
        ];

        const ADS = [
            { id: 1, cat: 'laptops', name: 'MacBook Pro M3 Max', price: 'KSh 420,000', img: 'https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=800&q=80', specs: 'Brand New. 16-Core CPU, 40-Core GPU, 48GB RAM, 1TB SSD.', badge: 'Premium' },
            { id: 2, cat: 'phones', name: 'Samsung S24 Ultra', price: 'KSh 155,000', img: 'https://images.unsplash.com/photo-1678911820864-e2c567c655d7?auto=format&fit=crop&w=800&q=80', specs: 'Titanium Gray. 512GB Storage. Galaxy AI features enabled.', badge: 'Verified' },
            { id: 3, cat: 'motors', name: 'Mercedes GLE 450', price: 'KSh 12,850,000', img: 'https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?auto=format&fit=crop&w=800&q=80', specs: 'Zero Mileage. 2024 Model. Full Panoramic Roof. AMG Package.', badge: 'Showroom' },
            { id: 4, cat: 'fashion', name: 'Luxury Chronograph', price: 'KSh 18,500', img: 'https://images.unsplash.com/photo-1524592094714-0f0654e20314?auto=format&fit=crop&w=800&q=80', specs: 'Automatic movement. Sapphire glass. Water resistant 100m.', badge: 'Luxury' },
            { id: 5, cat: 'land', name: '1/4 Acre Runda', price: 'KSh 45,000,000', img: 'https://images.unsplash.com/photo-1500382017468-9049fee74a62?auto=format&fit=crop&w=800&q=80', specs: 'Ready Title. Gated community. Prime location near embassies.', badge: 'Prime' },
            { id: 6, cat: 'accessories', name: 'Sony WH-1000XM5', price: 'KSh 48,000', img: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80', specs: 'Noise Cancelling. 30hr Battery. Best-in-class audio quality.', badge: 'Genuine' },
            { id: 7, cat: 'laptops', name: 'Razer Blade 16', price: 'KSh 380,000', img: 'https://images.unsplash.com/photo-1544006659-f0b21f04cb1b?auto=format&fit=crop&w=800&q=80', specs: 'RTX 4090. Mini-LED Display. 32GB DDR5. Gaming Beast.', badge: 'Ultra' },
            { id: 8, cat: 'phones', name: 'iPhone 15 Pro', price: 'KSh 142,000', img: 'https://images.unsplash.com/photo-1695048133142-1a20484d2569?auto=format&fit=crop&w=800&q=80', specs: 'Blue Titanium. 256GB. Grade A Ex-UK. 100% Battery.', badge: 'Mint' }
        ];

        let currentCategory = 'all';

        function init() {
            renderCategories();
            filterMarket('all');
        }

        function renderCategories() {
            const container = document.getElementById('catList');
            container.innerHTML = CATEGORIES.map(c => `
                <div class="cat-pill ${currentCategory === c.id ? 'active' : ''}" onclick="filterMarket('${c.id}')">
                    <i class="fa ${c.icon}"></i> ${c.name}
                </div>
            `).join('');
        }

        function filterMarket(id) {
            currentCategory = id;
            const filtered = id === 'all' ? ADS : ADS.filter(a => a.cat === id);
            renderFeed(filtered);
            renderCategories();
            document.getElementById('catHeading').innerText = id === 'all' ? 'Featured Items' : CATEGORIES.find(c => c.id === id).name;
            document.getElementById('adStats').innerText = `Showing ${filtered.length} verified listings found in Kenya`;
        }

        function renderFeed(ads) {
            const grid = document.getElementById('productFeed');
            const isMobile = window.innerWidth < 768;
            
            grid.innerHTML = ads.map(a => `
                <div class="product-card" onclick="openProduct(${a.id})">
                    <div class="img-wrapper aspect-[4/5]">
                        <img src="${isMobile ? a.img.replace('w=800', 'w=400&q=40') : a.img}" class="w-full h-full object-cover">
                        <div class="absolute top-4 left-4 badge-premium">${a.badge}</div>
                    </div>
                    <div class="p-6">
                        <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2">${a.cat}</p>
                        <h4 class="text-lg font-bold truncate mb-2">${a.name}</h4>
                        <div class="flex items-center justify-between mt-auto">
                            <span class="text-lg font-black text-[var(--accent)]">${a.price}</span>
                            <span class="text-[10px] font-bold text-slate-500"><i class="fa fa-location-dot mr-1"></i> NAIROBI</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function handleSearch(val) {
            const q = val.toLowerCase();
            const filtered = ADS.filter(a => a.name.toLowerCase().includes(q) || a.specs.toLowerCase().includes(q));
            renderFeed(filtered);
        }

        function openProduct(id) {
            const ad = ADS.find(a => a.id === id);
            document.getElementById('m-img').src = ad.img;
            document.getElementById('m-name').innerText = ad.name;
            document.getElementById('m-price').innerText = ad.price;
            document.getElementById('m-specs').innerText = ad.specs;
            document.getElementById('m-cat').innerText = ad.cat;
            document.getElementById('m-badge').innerText = ad.badge;
            document.getElementById('viewModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('viewModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function contact(type) {
            alert(`Opening ${type} for Soko Mpya Merchant...`);
        }

        function openPostItem() {
            alert("Soko Mpya: Upload your items to reach 10,000+ buyers daily.");
        }

        init();
    </script>
</body>
</html>
