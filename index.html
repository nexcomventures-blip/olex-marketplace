<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soko Mpya | The New Market Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v6.5.1/css/all.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050507;
            --surface: #0f1014;
            --border: rgba(255, 255, 255, 0.05);
            --indigo: #6366f1;
            --mpya: #10b981; /* Fresh emerald green for "Mpya" */
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Layout */
        .jiji-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 24px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 100px 24px 40px;
        }

        @media (max-width: 1024px) {
            .jiji-grid { grid-template-columns: 1fr; padding-top: 80px; }
        }

        /* Sidebar */
        .sidebar {
            position: sticky;
            top: 100px;
            height: calc(100vh - 120px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow-y: auto;
            padding: 12px;
        }

        .cat-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 16px;
            color: var(--text-dim);
            transition: all 0.3s;
            cursor: pointer;
            margin-bottom: 4px;
        }

        .cat-item:hover, .cat-item.active {
            background: rgba(99, 102, 241, 0.1);
            color: white;
        }

        .cat-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
        }

        .active .cat-icon { background: var(--indigo); color: white; }

        /* Listing Cards */
        .listing-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            transition: transform 0.3s, border-color 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .listing-card:hover {
            transform: translateY(-5px);
            border-color: var(--indigo);
        }

        /* Mobile Optimized Images */
        .img-container img {
            width: 100%;
            height: 100%;
            object-contain: contain;
        }

        @media (max-width: 640px) {
            .img-container img {
                /* Low-res hint for mobile browsers via style */
                image-rendering: -webkit-optimize-contrast;
            }
        }

        /* Search & Navigation */
        .search-bar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .search-bar input { background: transparent; border: none; outline: none; color: white; width: 100%; font-size: 14px; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <!-- Top Nav -->
    <nav class="fixed top-0 w-full z-50 bg-[#050507]/90 backdrop-blur-md border-b border-white/5">
        <div class="max-w-[1400px] mx-auto px-4 h-20 flex items-center justify-between">
            <a href="#" class="text-2xl font-black italic tracking-tighter">SOKO <span class="text-[#10b981]">MPYA</span></a>
            
            <div class="search-bar max-w-md hidden lg:flex flex-1 mx-8">
                <i class="fa fa-search text-slate-500"></i>
                <input type="text" id="desktopSearch" placeholder="Search anything..." onkeyup="handleSearch(this.value)">
            </div>

            <div class="flex items-center gap-4">
                <button onclick="openPostItem()" class="bg-[#10b981] hover:bg-indigo-500 text-white px-5 py-2 rounded-xl text-xs font-bold uppercase transition">
                    <i class="fa fa-plus-circle mr-2"></i>Post Ad
                </button>
            </div>
        </div>
    </nav>

    <div class="jiji-grid">
        <!-- Sidebar (Functional Categories) -->
        <aside class="sidebar hidden lg:block">
            <h3 class="px-5 py-4 text-[10px] font-black uppercase tracking-widest text-slate-500 border-b border-white/5 mb-4">Categories</h3>
            <div id="sidebarCats">
                <!-- Rendered via JS -->
            </div>
        </aside>

        <!-- Feed Area -->
        <main>
            <!-- Mobile Search & Quick Links -->
            <div class="lg:hidden mb-6 space-y-4">
                <div class="search-bar">
                    <i class="fa fa-search text-slate-500"></i>
                    <input type="text" placeholder="Search for items..." onkeyup="handleSearch(this.value)">
                </div>
                <div class="grid grid-cols-4 gap-2" id="mobileCats">
                    <!-- Rendered via JS -->
                </div>
            </div>

            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold" id="categoryTitle">All Listings</h2>
                <span class="text-xs text-slate-500" id="adCount">Loading ads...</span>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-3 xl:grid-cols-4 gap-4" id="mainGrid">
                <!-- Ads Injected Here -->
            </div>
        </main>
    </div>

    <!-- Product View Modal -->
    <div id="viewModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/95" onclick="closeModal()"></div>
        <div class="relative bg-[#0f1014] border border-white/10 w-full max-w-4xl rounded-[32px] overflow-hidden flex flex-col md:flex-row max-h-[90vh]">
            <button onclick="closeModal()" class="absolute top-4 right-4 z-10 w-8 h-8 rounded-full bg-white/10 flex items-center justify-center"><i class="fa fa-times"></i></button>
            
            <div class="md:w-1/2 bg-black flex items-center justify-center p-8">
                <img id="m-img" src="" class="max-w-full max-h-full object-contain">
            </div>
            
            <div class="md:w-1/2 p-8 overflow-y-auto">
                <div class="flex items-center gap-2 mb-2">
                    <span id="m-badge" class="px-2 py-0.5 bg-indigo-500/20 text-[#10b981] text-[10px] font-bold rounded uppercase"></span>
                    <span id="m-cat" class="text-[10px] text-slate-500 uppercase font-black"></span>
                </div>
                <h2 id="m-name" class="text-2xl font-black mb-1"></h2>
                <p id="m-price" class="text-xl font-black text-[#10b981] mb-6"></p>
                <div class="bg-white/5 rounded-2xl p-4 border border-white/5 mb-6">
                    <p id="m-specs" class="text-sm text-slate-400 leading-relaxed"></p>
                </div>
                <div class="space-y-3">
                    <button onclick="contactMerchant('Call')" class="w-full py-4 bg-white text-black font-black rounded-2xl uppercase text-xs">Call Merchant</button>
                    <button onclick="contactMerchant('WhatsApp')" class="w-full py-4 bg-[#25D366] text-white font-black rounded-2xl uppercase text-xs">WhatsApp</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CATEGORIES = [
            { id: 'laptops', name: 'Laptops', icon: 'fa-laptop', count: 120 },
            { id: 'phones', name: 'Phones', icon: 'fa-mobile-screen', count: 85 },
            { id: 'motors', name: 'Motors', icon: 'fa-car', count: 42 },
            { id: 'fashion', name: 'Fashion', icon: 'fa-shirt', count: 210 },
            { id: 'land', name: 'Land', icon: 'fa-mountain-city', count: 15 },
            { id: 'accessories', name: 'Accessories', icon: 'fa-plug-circle-plus', count: 95 }
        ];

        const ADS = [
            { id: 1, cat: 'laptops', name: 'MacBook Pro M2 14"', price: 'KSh 245,000', img: 'https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=400&q=60', specs: '8-Core CPU, 10-Core GPU, 16GB Unified Memory, 512GB SSD.', badge: 'New' },
            { id: 2, cat: 'phones', name: 'iPhone 15 Pro Max', price: 'KSh 185,000', img: 'https://images.unsplash.com/photo-1695048133142-1a20484d2569?auto=format&fit=crop&w=400&q=60', specs: '256GB, Natural Titanium, All-day battery life.', badge: 'Verified' },
            { id: 3, cat: 'motors', name: 'Toyota Harrier 2018', price: 'KSh 3,850,000', img: 'https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?auto=format&fit=crop&w=400&q=60', specs: 'Panoramic Sunroof, Leather Interior, Zero Mileage Local.', badge: 'Certified' },
            { id: 4, cat: 'fashion', name: 'Silk Dinner Dress', price: 'KSh 4,500', img: 'https://images.unsplash.com/photo-1539109132381-31a15b2c5a62?auto=format&fit=crop&w=400&q=60', specs: 'Premium silk, available in all sizes. Perfect for weddings.', badge: 'Boutique' },
            { id: 5, cat: 'land', name: '50x100 Kamulu', price: 'KSh 950,000', img: 'https://images.unsplash.com/photo-1500382017468-9049fee74a62?auto=format&fit=crop&w=400&q=60', specs: 'Prime land near tarmac. Ready Title Deed. Water/Power on site.', badge: 'Urgent' },
            { id: 6, cat: 'accessories', name: 'Logitech MX Master 3', price: 'KSh 12,500', img: 'https://images.unsplash.com/photo-1527864550417-7fd91fc51a46?auto=format&fit=crop&w=400&q=60', specs: 'Ultrafast MagSpeed scrolling, 4000 DPI sensor.', badge: 'Genuine' },
            { id: 7, cat: 'laptops', name: 'HP EliteBook 840 G8', price: 'KSh 85,000', img: 'https://images.unsplash.com/photo-1496181133206-80ce9b88a853?auto=format&fit=crop&w=400&q=60', specs: 'Core i7 11th Gen, 16GB RAM, 512GB SSD.', badge: 'Ex-UK' },
            { id: 8, cat: 'phones', name: 'Samsung S23 Ultra', price: 'KSh 135,000', img: 'https://images.unsplash.com/photo-1678911820864-e2c567c655d7?auto=format&fit=crop&w=400&q=60', specs: 'S-Pen included, 200MP Camera, 5000mAh Battery.', badge: 'Mint' }
        ];

        let currentCat = 'all';

        function init() {
            renderSidebar();
            renderMobileCats();
            filterAds('all');
        }

        function renderSidebar() {
            const container = document.getElementById('sidebarCats');
            container.innerHTML = `
                <div class="cat-item ${currentCat === 'all' ? 'active' : ''}" onclick="filterAds('all')">
                    <div class="cat-icon"><i class="fa fa-grid-2"></i></div>
                    <span class="text-[11px] font-black uppercase">All Market</span>
                </div>
            ` + CATEGORIES.map(c => `
                <div class="cat-item ${currentCat === c.id ? 'active' : ''}" onclick="filterAds('${c.id}')">
                    <div class="cat-icon"><i class="fa ${c.icon}"></i></div>
                    <div class="flex-1">
                        <p class="text-[11px] font-black uppercase">${c.name}</p>
                        <p class="text-[9px] text-slate-500">${c.count} ads</p>
                    </div>
                </div>
            `).join('');
        }

        function renderMobileCats() {
            const container = document.getElementById('mobileCats');
            container.innerHTML = CATEGORIES.slice(0, 4).map(c => `
                <button class="flex flex-col items-center gap-2 p-3 bg-white/5 rounded-2xl border border-white/5" onclick="filterAds('${c.id}')">
                    <i class="fa ${c.icon} text-lg text-slate-400"></i>
                    <span class="text-[8px] font-black uppercase text-slate-500">${c.name}</span>
                </button>
            `).join('');
        }

        function filterAds(catId) {
            currentCat = catId;
            const filtered = catId === 'all' ? ADS : ADS.filter(a => a.cat === catId);
            renderAds(filtered);
            renderSidebar();
            document.getElementById('categoryTitle').innerText = catId === 'all' ? 'All Listings' : CATEGORIES.find(c => c.id === catId).name;
            document.getElementById('adCount').innerText = `${filtered.length} items found`;
        }

        function renderAds(ads) {
            const grid = document.getElementById('mainGrid');
            const isMobile = window.innerWidth < 768;
            
            grid.innerHTML = ads.map(a => {
                // If on mobile, use a smaller image size hint if supported by the provider, 
                // or just keep original. Unsplash supports it via q= parameter.
                const imgUrl = isMobile ? a.img.replace('q=60', 'q=30&w=200') : a.img;
                
                return `
                    <div class="listing-card" onclick="openProduct(${a.id})">
                        <div class="aspect-square bg-slate-900 flex items-center justify-center p-2 img-container relative">
                            <img src="${imgUrl}" alt="${a.name}" loading="lazy">
                            <span class="absolute top-2 left-2 px-2 py-0.5 bg-black/60 backdrop-blur-md text-[8px] font-black text-white uppercase rounded">${a.badge}</span>
                        </div>
                        <div class="p-3">
                            <h4 class="text-[11px] font-bold truncate">${a.name}</h4>
                            <p class="text-xs font-black text-[#10b981] mt-1">${a.price}</p>
                            <p class="text-[9px] text-slate-500 mt-2"><i class="fa fa-location-dot mr-1"></i> Nairobi</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function handleSearch(val) {
            const query = val.toLowerCase();
            const filtered = ADS.filter(a => a.name.toLowerCase().includes(query) || a.specs.toLowerCase().includes(query));
            renderAds(filtered);
        }

        function openProduct(id) {
            const ad = ADS.find(a => a.id === id);
            document.getElementById('m-img').src = ad.img;
            document.getElementById('m-name').innerText = ad.name;
            document.getElementById('m-price').innerText = ad.price;
            document.getElementById('m-specs').innerText = ad.specs;
            document.getElementById('m-cat').innerText = ad.cat;
            document.getElementById('m-badge').innerText = ad.badge;
            document.getElementById('viewModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('viewModal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function contactMerchant(type) {
            alert(`${type} initiated to nexcom ventures (Verified Merchant).`);
        }

        function openPostItem() {
            alert("Starting 'Sell Flow'... Select a category to upload photos.");
        }

        init();
    </script>
</body>
</html>
