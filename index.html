<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLEX | Premium Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --indigo: #6366f1;
            --bg: #050507;
            --surface: #111115;
            --border: rgba(255, 255, 255, 0.08);
        }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg); 
            color: white;
        }
        .jiji-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 24px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }
        .sidebar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            height: fit-content;
        }
        .category-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            transition: all 0.2s;
            color: #94a3b8;
            font-size: 14px;
            font-weight: 600;
        }
        .category-link:hover {
            background: rgba(99, 102, 241, 0.1);
            color: var(--indigo);
        }
        .category-link.active {
            background: var(--indigo);
            color: white;
        }
        .listing-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .listing-card:hover {
            transform: translateY(-4px);
            border-color: var(--indigo);
        }
        .search-bar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 20px;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .search-bar input {
            background: transparent;
            border: none;
            outline: none;
            color: white;
            width: 100%;
        }
        .premium-tag {
            background: rgba(99, 102, 241, 0.2);
            color: var(--indigo);
            font-size: 10px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }
    </style>
</head>
<body class="pt-24">

    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-50 bg-[#050507]/80 backdrop-blur-md border-b border-white/5">
        <div class="max-w-[1400px] mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-8 flex-1">
                <a href="index.html" class="text-2xl font-black italic tracking-tighter">OL<span class="text-[#6366f1]">EX</span></a>
                <div class="search-bar max-w-xl hidden md:flex">
                    <i class="fa fa-search text-slate-500"></i>
                    <input type="text" placeholder="Search for premium laptops, cars, or property...">
                    <button class="bg-[#6366f1] px-4 py-1.5 rounded-lg text-xs font-bold">Search</button>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <button class="text-sm font-bold text-slate-400">Sign in</button>
                <button class="bg-white text-black px-6 py-2.5 rounded-xl text-xs font-black uppercase tracking-wider">Sell</button>
            </div>
        </div>
    </nav>

    <div class="jiji-grid">
        
        <!-- Sidebar Navigation -->
        <aside class="sidebar hidden lg:block">
            <h3 class="px-3 text-[10px] font-black uppercase tracking-widest text-slate-500 mb-4">Navigation</h3>
            <nav class="space-y-1">
                <a href="merchant.html" class="category-link flex items-center gap-3 px-3 py-2 text-indigo-400 border border-indigo-500/20 bg-indigo-500/5 rounded-lg mb-4 text-xs font-black uppercase tracking-tighter"><i class="fa fa-chart-line"></i> Dashboard</a>
                <a href="#" class="category-link active"><i class="fa fa-laptop w-5"></i> Electronics</a>
                <a href="#" class="category-link"><i class="fa fa-car w-5"></i> Vehicles</a>
                <a href="#" class="category-link"><i class="fa fa-house w-5"></i> Property</a>
                <a href="#" class="category-link"><i class="fa fa-mobile-screen w-5"></i> Mobile Phones</a>
                <a href="#" class="category-link"><i class="fa fa-couch w-5"></i> Home & Furniture</a>
                <a href="#" class="category-link"><i class="fa fa-briefcase w-5"></i> Services</a>
            </nav>
        </aside>

        <!-- Feed Section -->
        <main>
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold">Nexcom Premium Laptops</h2>
                <div class="flex gap-2">
                    <span class="text-xs font-bold text-slate-500">Filter:</span>
                    <select class="bg-transparent text-xs font-bold outline-none" id="brandFilter">
                        <option value="all">All Brands</option>
                        <option value="hp">HP</option>
                        <option value="dell">Dell</option>
                        <option value="lenovo">Lenovo</option>
                        <option value="apple">Apple</option>
                    </select>
                </div>
            </div>

            <!-- Product Feed (Populated by JS) -->
            <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4" id="productGrid">
                <!-- Products will be injected here -->
            </div>
        </main>
    </div>

            {

        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = LAPTOPS.map(p => `
                <div class="listing-card">
                    <div class="aspect-square bg-slate-800 relative">
                        <div class="absolute top-2 left-2 premium-tag">${p.id.includes('exuk') ? 'Ex-UK' : 'New'}</div>
                        <img src="${p.img}" class="w-full h-full object-contain p-4 opacity-90" alt="${p.name}">
                    </div>
                    <div class="p-4 flex-1 flex flex-direction: column">
                        <p class="text-[10px] font-bold text-[#6366f1] uppercase mb-1">${p.brand}</p>
                        <h4 class="text-sm font-bold truncate mb-1">${p.name}</h4>
                        <p class="text-[10px] text-slate-500 mb-3 line-clamp-2 leading-relaxed">${p.specs}</p>
                        <div class="mt-auto flex justify-between items-center">
                            <span class="text-sm font-black italic">${p.price}</span>
                            <button class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center hover:bg-[#6366f1] transition border border-white/5">
                                <i class="fa fa-shield-halved text-[10px]"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        renderProducts();
    </script>
</body>
</html>
