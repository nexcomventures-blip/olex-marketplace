<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLEX | Join the Elite Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --indigo: #6366f1;
            --bg: #050507;
            --surface: #111115;
            --border: rgba(255, 255, 255, 0.08);
        }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg); 
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .auth-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 48px;
            width: 100%;
            max-width: 540px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .input-group {
            margin-bottom: 24px;
        }
        .input-label {
            display: block;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        .input-field {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 20px;
            width: 100%;
            color: white;
            outline: none;
            transition: all 0.2s;
        }
        .input-field:focus {
            border-color: var(--indigo);
            background: rgba(99, 102, 241, 0.05);
        }
        .verification-box {
            background: rgba(99, 102, 241, 0.05);
            border: 1px dashed var(--indigo);
            border-radius: 16px;
            padding: 24px;
            margin-top: 32px;
        }
        .btn-primary {
            background: var(--indigo);
            color: white;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 16px;
            border-radius: 16px;
            width: 100%;
            transition: all 0.2s;
            margin-top: 12px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="text-center mb-10">
            <a href="index.html" class="text-3xl font-black italic tracking-tighter">OL<span class="text-[#6366f1]">EX</span></a>
            <h1 class="text-2xl font-extrabold mt-4">Create your account</h1>
            <p class="text-slate-500 text-sm mt-2">Join Nairobi's most secure marketplace</p>
        </div>

        <form>
            <div class="grid grid-cols-2 gap-4">
                <div class="input-group">
                    <label class="input-label">Full Name</label>
                    <input type="text" class="input-field" placeholder="John Doe" required>
                </div>
                <div class="input-group">
                    <label class="input-label">Business Name (Optional)</label>
                    <input type="text" class="input-field" placeholder="e.g. Nexcom Ventures">
                </div>
            </div>

            <div class="input-group">
                <label class="input-label">Email Address</label>
                <input type="email" class="input-field" placeholder="name@company.com" required>
            </div>

            <div class="input-group">
                <label class="input-label">Password</label>
                <input type="password" class="input-field" placeholder="••••••••" required>
            </div>

            <!-- Seller Verification Section -->
            <div class="verification-box">
                <div class="flex items-center gap-3 mb-4">
                    <i class="fa fa-shield-halved text-[#6366f1] text-xl"></i>
                    <div>
                        <h3 class="text-sm font-bold">Seller Verification</h3>
                        <p class="text-[10px] text-slate-500">Required for all merchants and high-end sellers</p>
                    </div>
                </div>
                
                <div class="input-group">
                    <label class="input-label text-[#6366f1]">Document Type</label>
                    <select class="input-field">
                        <option>National ID Card</option>
                        <option>Passport</option>
                        <option>Driving License</option>
                    </select>
                </div>

                <div class="input-group">
                    <label class="input-label text-[#6366f1]">Document Number</label>
                    <input type="text" class="input-field" placeholder="ID / Passport Number" required>
                    <p class="text-[9px] text-slate-600 mt-2 italic">Note: Each document can only be linked to ONE account for security purposes.</p>
                </div>

                <div class="input-group mb-0">
                    <label class="input-label text-[#6366f1]">Upload Front of Document</label>
                    <div class="relative">
                        <input type="file" class="hidden" id="docUpload">
                        <label for="docUpload" class="flex items-center justify-center gap-2 p-4 border border-white/5 bg-white/5 rounded-xl cursor-pointer hover:bg-white/10 transition">
                            <i class="fa fa-cloud-arrow-up text-slate-400"></i>
                            <span class="text-xs font-bold text-slate-400">Select Image File</span>
                        </label>
                    </div>
                </div>
            </div>

            <div class="mt-10">
                <button type="submit" class="btn-primary">Create Secure Account</button>
                <p class="text-center text-xs text-slate-500 mt-6">
                    Already have an account? <a href="login.html" class="text-[#6366f1] font-bold">Sign in</a>
                </p>
            </div>
        </form>
    </div>

</body>
</html>
