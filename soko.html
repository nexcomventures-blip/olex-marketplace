<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Soko Mpya | Shop Smarter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F9FAFB; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .category-scroll::-webkit-scrollbar { display: none; }
        .product-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .product-card:active { transform: scale(0.97); }
        .nav-active { color: #2563EB; }
        .nav-active i { transform: translateY(-2px); transition: transform 0.2s; }
        .gradient-text { background: linear-gradient(135deg, #2563EB 0%, #7C3AED 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        [x-cloak] { display: none !important; }
        
        /* Skeleton Animation */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #f8f8f8 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
        }
        .modal-enter { animation: modal-in 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes modal-in {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
    </style>
</head>
<body x-data="{ 
    tab: 'home', 
    searchQuery: '', 
    selectedCategory: 'All',
    selectedAd: null,
    loading: true,
    categories: [
        { name: 'All', icon: 'fa-border-all', color: 'bg-slate-500' },
        { name: 'Laptops', icon: 'fa-laptop', color: 'bg-blue-500' },
        { name: 'Phones', icon: 'fa-mobile-screen', color: 'bg-purple-500' },
        { name: 'Vehicles', icon: 'fa-car', color: 'bg-orange-500' },
        { name: 'Property', icon: 'fa-house', color: 'bg-emerald-500' },
        { name: 'Bikes', icon: 'fa-motorcycle', color: 'bg-rose-500' }
    ],
    ads: [],
    async init() {
        try {
            const resp = await fetch('ads.json');
            this.ads = await resp.json();
            setTimeout(() => this.loading = false, 800);
        } catch(e) { console.error(e); }
    },
    get filteredAds() {
        return this.ads.filter(ad => {
            const matchesSearch = ad.title.toLowerCase().includes(this.searchQuery.toLowerCase());
            const matchesCategory = this.selectedCategory === 'All' || ad.specs.Type === this.selectedCategory;
            return matchesSearch && matchesCategory;
        });
    },
    formatTime(dateStr) {
        const date = new Date(dateStr);
        const diffInSeconds = Math.floor((new Date() - date) / 1000);
        if (diffInSeconds < 60) return 'Just now';
        if (diffInSeconds < 3600) return `${Math.floor(diffInSeconds / 60)}m ago`;
        if (diffInSeconds < 86400) return `${Math.floor(diffInSeconds / 3600)}h ago`;
        return `${Math.floor(diffInSeconds / 86400)}d ago`;
    }
}" x-init="init()" x-cloak>

    <!-- App Header -->
    <header class="sticky top-0 z-50 glass border-b border-slate-100">
        <div class="px-4 py-4 flex flex-col gap-3">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight gradient-text">Soko Mpya</h1>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">By Nexcom Ventures</p>
                </div>
                <div class="flex gap-3">
                    <button class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 relative">
                        <i class="fa-regular fa-bell"></i>
                        <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></span>
                    </button>
                    <button class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-600">
                        <i class="fa-regular fa-heart"></i>
                    </button>
                </div>
            </div>
            
            <!-- Modern Search Bar -->
            <div class="relative group">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 transition-colors group-focus-within:text-blue-500"></i>
                <input type="text" placeholder="Search laptops, cars, property..." 
                    class="w-full bg-slate-100 border-none rounded-2xl py-3.5 pl-11 pr-4 text-sm focus:ring-2 focus:ring-blue-500/20 focus:bg-white transition-all outline-none"
                    x-model="searchQuery">
            </div>
        </div>
    </header>

    <!-- Main View -->
    <main class="animate-in fade-in duration-500">
        
        <!-- Category Horizontal Scroll -->
        <div class="mt-4 px-4 overflow-x-auto category-scroll flex gap-4">
            <template x-for="cat in categories">
                <div @click="selectedCategory = cat.name" class="flex flex-col items-center gap-2 flex-shrink-0 cursor-pointer group">
                    <div :class="`w-14 h-14 ${cat.color} rounded-2xl flex items-center justify-center text-white shadow-lg shadow-inherit/20 group-hover:-translate-y-1 transition-all ${selectedCategory === cat.name ? 'ring-4 ring-offset-2 ring-blue-500' : ''}`">
                        <i :class="`fa-solid ${cat.icon} text-xl`"></i>
                    </div>
                    <span :class="selectedCategory === cat.name ? 'text-blue-600 font-black' : 'text-slate-600 font-bold'" class="text-[11px] uppercase tracking-tight" x-text="cat.name"></span>
                </div>
            </template>
        </div>

        <!-- Promo Banner -->
        <div class="mx-4 mt-8 p-6 rounded-3xl bg-gradient-to-br from-blue-600 to-indigo-700 text-white relative overflow-hidden shadow-xl shadow-blue-500/20">
            <div class="relative z-10">
                <span class="bg-white/20 text-[10px] font-black uppercase px-2 py-1 rounded-md">Featured Partner</span>
                <h3 class="text-2xl font-bold mt-2">Sell Faster on <br>Soko Mpya</h3>
                <p class="text-blue-100 text-xs mt-2 opacity-80">Join 5,000+ verified merchants today.</p>
                <button class="mt-4 bg-white text-blue-600 px-5 py-2.5 rounded-xl text-xs font-black shadow-lg">Post Ad Free</button>
            </div>
            <i class="fa-solid fa-rocket absolute -right-4 -bottom-4 text-8xl opacity-10 rotate-12"></i>
        </div>

        <!-- Ad Feed -->
        <div class="mt-8 px-4">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-extrabold text-slate-800">Fresh Findings</h2>
                <button class="text-xs font-bold text-blue-600">Filters <i class="fa-solid fa-sliders ml-1"></i></button>
            </div>

            <!-- Loading Skeleton -->
            <div x-show="loading" class="grid grid-cols-2 gap-4">
                <template x-for="i in [1,2,3,4]">
                    <div class="bg-white rounded-3xl overflow-hidden border border-slate-100 p-3">
                        <div class="skeleton aspect-square rounded-2xl mb-3"></div>
                        <div class="skeleton h-4 w-3/4 rounded-full mb-2"></div>
                        <div class="skeleton h-3 w-1/2 rounded-full"></div>
                    </div>
                </template>
            </div>

            <!-- Grid Layout -->
            <div x-show="!loading" class="grid grid-cols-2 gap-4">
                <template x-for="ad in filteredAds" :key="ad.id">
                    <div @click="selectedAd = ad" class="product-card bg-white rounded-3xl overflow-hidden border border-slate-100 shadow-sm hover:shadow-xl transition-all">
                        <div class="relative aspect-square">
                            <img :src="ad.images[0]" class="w-full h-full object-cover">
                            <div class="absolute top-3 left-3 bg-white/90 backdrop-blur-md px-2 py-1 rounded-lg text-[9px] font-black uppercase tracking-wider text-slate-800 flex items-center gap-1">
                                <i class="fa-solid fa-bolt text-blue-500"></i> TOP
                            </div>
                        </div>
                        <div class="p-4">
                            <p class="text-blue-600 font-extrabold text-lg" x-text="`KSh ${ad.price.toLocaleString()}`"></p>
                            <h4 class="text-xs font-semibold text-slate-800 mt-1 line-clamp-1 leading-relaxed" x-text="ad.title"></h4>
                            
                            <div class="mt-2 flex items-center justify-between text-[9px] font-bold text-slate-400 uppercase">
                                <div class="flex items-center gap-1">
                                    <i class="fa-solid fa-location-dot"></i>
                                    <span class="truncate max-w-[60px]" x-text="ad.location.split(',')[0]"></span>
                                </div>
                                <span x-text="formatTime(ad.time)"></span>
                            </div>

                            <!-- Modern WhatsApp Button -->
                            <a @click.stop :href="`https://wa.me/254722816001?text=Hi Nexcom, I'm interested in the ${ad.title} listed on Soko Mpya for KSh ${ad.price.toLocaleString()}.`" 
                               class="mt-4 w-full bg-green-500 hover:bg-green-600 text-white py-2.5 rounded-xl text-[10px] font-black flex items-center justify-center gap-2 transition-colors">
                                <i class="fa-brands fa-whatsapp text-sm"></i> CHAT TO BUY
                            </a>
                        </div>
                    </div>
                </template>
            </div>
            
            <!-- Empty State -->
            <div x-show="filteredAds.length === 0" class="mt-20 text-center px-10">
                <div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mx-auto text-slate-300 text-3xl mb-4">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <h3 class="text-slate-800 font-bold">No items found</h3>
                <p class="text-slate-400 text-xs mt-2">Try adjusting your filters or search keywords.</p>
            </div>
        </div>
        
        <div class="h-24"></div> <!-- Spacer for Nav -->
    </main>

    <!-- Item Detail Modal -->
    <div x-show="selectedAd" class="fixed inset-0 z-[100] flex items-end justify-center" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" @click="selectedAd = null"></div>
        <div x-show="selectedAd" class="bg-white w-full max-w-lg rounded-t-[40px] relative z-10 modal-enter overflow-hidden flex flex-col max-h-[90vh]">
            <div class="h-1.5 w-12 bg-slate-200 rounded-full mx-auto mt-4 mb-2"></div>
            
            <div class="overflow-y-auto pb-32">
                <div class="relative h-72">
                    <img :src="selectedAd?.images[0]" class="w-full h-full object-cover">
                    <button @click="selectedAd = null" class="absolute top-6 right-6 w-10 h-10 bg-white/20 backdrop-blur-md rounded-full text-white flex items-center justify-center">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                
                <div class="p-6">
                    <div class="flex justify-between items-center">
                        <p class="text-3xl font-black text-blue-600" x-text="`KSh ${selectedAd?.price.toLocaleString()}`"></p>
                        <span class="bg-blue-50 text-blue-600 text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-widest">Featured</span>
                    </div>
                    <h3 class="text-xl font-bold mt-4 text-slate-900 leading-tight" x-text="selectedAd?.title"></h3>
                    
                    <div class="mt-6 grid grid-cols-2 gap-4">
                        <template x-for="(val, key) in selectedAd?.specs">
                            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest" x-text="key"></p>
                                <p class="text-sm font-bold text-slate-800 mt-1" x-text="val"></p>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Sticky Action Bar in Modal -->
            <div class="absolute bottom-0 left-0 right-0 p-6 glass border-t border-slate-100">
                <a :href="`https://wa.me/254722816001?text=Hi Nexcom, I'm interested in the ${selectedAd?.title} listed on Soko Mpya for KSh ${selectedAd?.price.toLocaleString()}.`" 
                   class="w-full bg-green-500 text-white py-5 rounded-2xl font-black flex items-center justify-center gap-3 shadow-xl shadow-green-500/20 active:scale-95 transition-all">
                    <i class="fa-brands fa-whatsapp text-xl"></i> START CHAT TO BUY
                </a>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar (Modern Dock Style) -->
    <div class="fixed bottom-6 left-4 right-4 z-50">
        <nav class="glass border border-white/50 rounded-full py-2 px-3 shadow-2xl flex items-center justify-between">
            <button @click="tab = 'home'" :class="tab === 'home' ? 'nav-active' : 'text-slate-400'" class="flex flex-col items-center gap-1 flex-1 py-1">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[9px] font-bold uppercase">Feed</span>
            </button>
            
            <button @click="tab = 'messages'" :class="tab === 'messages' ? 'nav-active' : 'text-slate-400'" class="flex flex-col items-center gap-1 flex-1 py-1">
                <i class="fa-solid fa-message text-lg"></i>
                <span class="text-[9px] font-bold uppercase">Chat</span>
            </button>

            <!-- Prominent Action Button -->
            <button class="w-14 h-14 bg-gradient-to-tr from-blue-600 to-indigo-600 text-white rounded-full flex items-center justify-center shadow-lg shadow-blue-600/40 -mt-8 border-4 border-slate-50 transition-transform active:scale-90">
                <i class="fa-solid fa-plus text-xl"></i>
            </button>

            <button @click="tab = 'ads'" :class="tab === 'ads' ? 'nav-active' : 'text-slate-400'" class="flex flex-col items-center gap-1 flex-1 py-1">
                <i class="fa-solid fa-layer-group text-lg"></i>
                <span class="text-[9px] font-bold uppercase">My Ads</span>
            </button>

            <button @click="tab = 'profile'" :class="tab === 'profile' ? 'nav-active' : 'text-slate-400'" class="flex flex-col items-center gap-1 flex-1 py-1">
                <i class="fa-solid fa-user-gear text-lg"></i>
                <span class="text-[9px] font-bold uppercase">Me</span>
            </button>
        </nav>
    </div>

</body>
</html>
