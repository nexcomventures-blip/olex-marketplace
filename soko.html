<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Soko Mpya | Shop Smarter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F9FAFB; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .category-scroll::-webkit-scrollbar { display: none; }
        .product-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .product-card:active { transform: scale(0.97); }
        .nav-active { color: #2563EB; }
        .nav-active i { transform: translateY(-2px); transition: transform 0.2s; }
        .gradient-text { background: linear-gradient(135deg, #2563EB 0%, #7C3AED 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body x-data="{ 
    tab: 'home', 
    searchQuery: '', 
    categories: [
        { name: 'Laptops', icon: 'fa-laptop', color: 'bg-blue-500' },
        { name: 'Phones', icon: 'fa-mobile-screen', color: 'bg-purple-500' },
        { name: 'Vehicles', icon: 'fa-car', color: 'bg-orange-500' },
        { name: 'Property', icon: 'fa-house', color: 'bg-emerald-500' },
        { name: 'Bikes', icon: 'fa-motorcycle', color: 'bg-rose-500' },
        { name: 'Services', icon: 'fa-briefcase', color: 'bg-indigo-500' }
    ],
    ads: []
}" x-init="ads = await (await fetch('ads.json')).json()">

    <!-- App Header -->
    <header class="sticky top-0 z-50 glass border-b border-slate-100">
        <div class="px-4 py-4 flex flex-col gap-3">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-2xl font-extrabold tracking-tight gradient-text">Soko Mpya</h1>
                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">By Nexcom Ventures</p>
                </div>
                <div class="flex gap-3">
                    <button class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 relative">
                        <i class="fa-regular fa-bell"></i>
                        <span class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></span>
                    </button>
                    <button class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-600">
                        <i class="fa-regular fa-heart"></i>
                    </button>
                </div>
            </div>
            
            <!-- Modern Search Bar -->
            <div class="relative group">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 transition-colors group-focus-within:text-blue-500"></i>
                <input type="text" placeholder="Search laptops, cars, property..." 
                    class="w-full bg-slate-100 border-none rounded-2xl py-3.5 pl-11 pr-4 text-sm focus:ring-2 focus:ring-blue-500/20 focus:bg-white transition-all outline-none"
                    x-model="searchQuery">
            </div>
        </div>
    </header>

    <!-- Main View -->
    <main class="animate-in fade-in duration-500">
        
        <!-- Category Horizontal Scroll -->
        <div class="mt-4 px-4 overflow-x-auto category-scroll flex gap-4">
            <template x-for="cat in categories">
                <div class="flex flex-col items-center gap-2 flex-shrink-0 cursor-pointer group">
                    <div :class="`w-14 h-14 ${cat.color} rounded-2xl flex items-center justify-center text-white shadow-lg shadow-inherit/20 group-hover:-translate-y-1 transition-transform`">
                        <i :class="`fa-solid ${cat.icon} text-xl`"></i>
                    </div>
                    <span class="text-[11px] font-bold text-slate-600 uppercase tracking-tight" x-text="cat.name"></span>
                </div>
            </template>
        </div>

        <!-- Promo Banner -->
        <div class="mx-4 mt-8 p-6 rounded-3xl bg-gradient-to-br from-blue-600 to-indigo-700 text-white relative overflow-hidden shadow-xl shadow-blue-500/20">
            <div class="relative z-10">
                <span class="bg-white/20 text-[10px] font-black uppercase px-2 py-1 rounded-md">Featured Partner</span>
                <h3 class="text-2xl font-bold mt-2">Sell Faster on <br>Soko Mpya</h3>
                <p class="text-blue-100 text-xs mt-2 opacity-80">Join 5,000+ verified merchants today.</p>
                <button class="mt-4 bg-white text-blue-600 px-5 py-2.5 rounded-xl text-xs font-black shadow-lg">Post Ad Free</button>
            </div>
            <i class="fa-solid fa-rocket absolute -right-4 -bottom-4 text-8xl opacity-10 rotate-12"></i>
        </div>

        <!-- Ad Feed -->
        <div class="mt-8 px-4">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-extrabold text-slate-800">Fresh Findings</h2>
                <button class="text-xs font-bold text-blue-600">Filters <i class="fa-solid fa-sliders ml-1"></i></button>
            </div>

            <!-- Grid Layout -->
            <div class="grid grid-cols-2 gap-4">
                <template x-for="ad in ads">
                    <div class="product-card bg-white rounded-3xl overflow-hidden border border-slate-100 shadow-sm hover:shadow-xl transition-all">
                        <div class="relative aspect-square">
                            <img :src="ad.images[0]" class="w-full h-full object-cover">
                            <div class="absolute top-3 left-3 bg-white/90 backdrop-blur-md px-2 py-1 rounded-lg text-[9px] font-black uppercase tracking-wider text-slate-800 flex items-center gap-1">
                                <i class="fa-solid fa-bolt text-blue-500"></i> TOP
                            </div>
                            <button class="absolute top-3 right-3 w-8 h-8 rounded-full bg-black/20 backdrop-blur-md flex items-center justify-center text-white text-xs">
                                <i class="fa-regular fa-heart"></i>
                            </button>
                        </div>
                        <div class="p-4">
                            <p class="text-blue-600 font-extrabold text-lg" x-text="`KSh ${ad.price.toLocaleString()}`"></p>
                            <h4 class="text-xs font-semibold text-slate-800 mt-1 line-clamp-2 leading-relaxed" x-text="ad.title"></h4>
                            
                            <div class="mt-3 flex items-center gap-1.5 text-[9px] font-bold text-slate-400 uppercase">
                                <i class="fa-solid fa-location-dot"></i>
                                <span class="truncate" x-text="ad.location"></span>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
        
        <div class="h-24"></div> <!-- Spacer for Nav -->
    </main>

    <!-- Bottom Navigation Bar (Modern Dock Style) -->
    <div class="fixed bottom-6 left-4 right-4 z-50">
        <nav class="glass border border-white/50 rounded-full py-2 px-3 shadow-2xl flex items-center justify-between">
            <button @click="tab = 'home'" :class="tab === 'home' ? 'nav-active' : 'text-slate-400'" class="flex flex-col items-center gap-1 flex-1 py-1">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[9px] font-bold uppercase">Feed</span>
            </button>
            
            <button @click="tab = 'messages'" :class="tab === 'messages' ? 'nav-active' : 'text-slate-400'" class="flex flex-col items-center gap-1 flex-1 py-1">
                <i class="fa-solid fa-message text-lg"></i>
                <span class="text-[9px] font-bold uppercase">Chat</span>
            </button>

            <!-- Prominent Action Button -->
            <button class="w-14 h-14 bg-gradient-to-tr from-blue-600 to-indigo-600 text-white rounded-full flex items-center justify-center shadow-lg shadow-blue-600/40 -mt-8 border-4 border-slate-50 transition-transform active:scale-90">
                <i class="fa-solid fa-plus text-xl"></i>
            </button>

            <button @click="tab = 'ads'" :class="tab === 'ads' ? 'nav-active' : 'text-slate-400'" class="flex flex-col items-center gap-1 flex-1 py-1">
                <i class="fa-solid fa-layer-group text-lg"></i>
                <span class="text-[9px] font-bold uppercase">My Ads</span>
            </button>

            <button @click="tab = 'profile'" :class="tab === 'profile' ? 'nav-active' : 'text-slate-400'" class="flex flex-col items-center gap-1 flex-1 py-1">
                <i class="fa-solid fa-user-gear text-lg"></i>
                <span class="text-[9px] font-bold uppercase">Me</span>
            </button>
        </nav>
    </div>

</body>
</html>
